<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 150" width="470" height="150" role="img" aria-label="Chasing Glory Together, CSV10C">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffd9c2"/>
      <stop offset="0.5" stop-color="#e0673f"/>
      <stop offset="1"   stop-color="#9b3a1e"/>
    </linearGradient>
  </defs>

  <!-- laurel-ish arcs around a star: chasing glory -->
  <g fill="none" stroke="url(#cg)" stroke-linecap="round">
    <path d="M186 78 A54 54 0 0 1 235 34" stroke-width="3"/>
    <path d="M284 78 A54 54 0 0 0 235 34" stroke-width="3"/>
    <path d="M196 92 A44 44 0 0 0 274 92" stroke-width="2.2" opacity="0.55"/>
