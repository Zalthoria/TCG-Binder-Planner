  <path d="M235 40 l7.4 15.6 17 2.4 -12.3 12.2 2.9 17.1 -15-8.1 -15 8.1 2.9-17.1 -12.3-12.2 17-2.4Z"
        fill="url(#cg)"/>

  <text x="235" y="124" text-anchor="middle"
        font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="27" font-weight="800"
        letter-spacing="2.4" fill="url(#cg)">CHASING GLORY</text>
  <text x="235" y="145" text-anchor="middle"
        font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700"
