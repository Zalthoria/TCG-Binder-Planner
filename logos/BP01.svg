<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 150" width="460" height="150" role="img" aria-label="Dawn of Palpagos, BP01">
  <defs>
    <linearGradient id="pwgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f4e2b6"/>
      <stop offset="0.5" stop-color="#cfae74"/>
      <stop offset="1"   stop-color="#a8834b"/>
    </linearGradient>
  </defs>

  <!-- rising sun over a horizon: the "dawn" -->
  <g stroke="#cfae74" fill="none" stroke-linecap="round">
    <path d="M120 62 A110 110 0 0 1 340 62" stroke-width="2.2" opacity="0.5"/>
    <path d="M150 97 A80 80 0 0 1 310 97" stroke-width="3" opacity="0.85"/>
    <path d="M96 97h268" stroke-width="2"/>
  </g>
  <circle cx="230" cy="97" r="26" fill="url(#pwgold)" opacity="0.9"/>

  <text x="230" y="60" text-anchor="middle"
        font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="33" font-weight="800"
        letter-spacing="3.4" fill="url(#pwgold)">DAWN OF</text>
  <text x="230" y="136" text-anchor="middle"
        font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="33" font-weight="800"
        letter-spacing="3.4" fill="url(#pwgold)">PALPAGOS</text>

  <text x="96" y="24" font-family="Outfit, Segoe UI, system-ui, sans-serif"
        font-size="13" font-weight="700" letter-spacing="4.5" fill="#8a7550">BP01</text>
  <text x="364" y="24" text-anchor="end" font-family="Outfit, Segoe UI, system-ui, sans-serif"
        font-size="13" font-weight="700" letter-spacing="2.6" fill="#8a7550">100 + 61</text>
</svg>
