<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCG Binder Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=16">
<script>
// Touch devices stuck on a desktop-width viewport (~980px) render everything tiny.
(function () {
  if (!matchMedia('(pointer: coarse)').matches) return;
  const z = Math.min(2.6, Math.max(1, window.innerWidth / 430));
  if (z > 1.08) { document.documentElement.style.zoom = z; window.__uiZoom = z; }
})();
</script>
<style>
.wrap { max-width: 1180px; margin: 0 auto; padding: 26px 24px 90px; }

/* Hero */
.hero { display: flex; align-items: center; gap: 26px; padding: 28px 32px; margin-bottom: 30px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(700px 260px at 8% 40%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%); pointer-events: none; }
.hero h1 { font-size: 30px; font-weight: 900; letter-spacing: -.8px; }
.hero h1 span { color: var(--accent); }
.hero .tag { font-size: 13px; color: var(--dim); margin-top: 4px; }
.hero .spacer { flex: 1; }
.gstats { display: flex; align-items: center; gap: 26px; }
.gstat { text-align: center; }
.gstat .v { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
.gstat .l { font-size: 9.5px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: 1.2px; margin-top: 2px; }

/* Section head */
.sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.sec-head h2 { font-size: 15px; font-weight: 800; letter-spacing: .2px; }
.sec-head .n { font-size: 11.5px; font-weight: 700; color: var(--faint); }
.sec-head::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* IP tiles */
.ips { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.ip {
  --a: var(--accent);
  position: relative; padding: 26px 24px 22px; cursor: pointer; overflow: hidden;
  display: flex; flex-direction: column; gap: 16px; min-height: 210px;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s;
}
.ip:hover { transform: translateY(-5px); border-color: color-mix(in srgb, var(--a) 55%, transparent);
  box-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 34px color-mix(in srgb, var(--a) 12%, transparent); }
.ip::before { content: ''; position: absolute; inset: 0;
  background: radial-gradient(420px 200px at 50% -40px, color-mix(in srgb, var(--a) 16%, transparent), transparent 75%);
  pointer-events: none; transition: opacity .2s; opacity: .85; }
.ip:hover::before { opacity: 1; }
.ip.empty { opacity: .5; cursor: default; filter: saturate(.35); }
.ip.empty:hover { transform: none; box-shadow: none; border-color: var(--line); }

.ip-mark { display: flex; align-items: center; gap: 14px; }
.ip-glyph { width: 46px; height: 46px; border-radius: 13px; flex: none; display: grid; place-items: center;
  font-size: 21px; font-weight: 900; letter-spacing: -1px;
  background: color-mix(in srgb, var(--a) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--a) 42%, transparent); color: var(--a);
  box-shadow: 0 0 22px color-mix(in srgb, var(--a) 22%, transparent); }
.ip-name { font-size: 20px; font-weight: 900; letter-spacing: -.5px; }
.ip-blurb { font-size: 11.5px; color: var(--faint); font-weight: 600; margin-top: 2px; }

.ip-body { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 11px; }
.ip-nums { display: flex; align-items: baseline; gap: 8px; }
.ip-nums .big { font-size: 27px; font-weight: 900; letter-spacing: -1px; color: var(--a); font-variant-numeric: tabular-nums; }
.ip-nums .of { font-size: 12.5px; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; }
.ip-bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; }
.ip-bar i { display: block; height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--a) 65%, transparent), var(--a));
  box-shadow: 0 0 10px color-mix(in srgb, var(--a) 55%, transparent);
  transition: width .7s cubic-bezier(.22,1,.36,1); }
.ip-foot { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; font-weight: 700; color: var(--faint); }
.ip-foot .go { color: var(--a); }

.ip-icon { width: 46px; height: 46px; flex: none; display: grid; place-items: center;
  border-radius: 13px; overflow: hidden; background: color-mix(in srgb, var(--a) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--a) 38%, transparent);
  box-shadow: 0 0 22px color-mix(in srgb, var(--a) 20%, transparent); }
.ip-icon img { width: 100%; height: 100%; object-fit: cover; }
.ip-mark.has-logo { flex-direction: column; align-items: flex-start; gap: 9px; }
.ip-logo { height: 46px; display: flex; align-items: center; }
.ip-logo img { height: 100%; width: auto; max-width: 210px; object-fit: contain;
  filter: drop-shadow(0 5px 14px color-mix(in srgb, var(--a) 40%, transparent)); }

@media (max-width: 800px) {
  .hero { flex-direction: column; text-align: center; }
  .gstats { flex-wrap: wrap; justify-content: center; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero glass">
    <div>
      <h1>TCG <span>Binder</span> Planner</h1>
      <div class="tag">Master-set tracking · every card, every binder</div>
    </div>
    <div class="spacer"></div>
    <div class="gstats">
      <div class="gstat"><div class="v" id="g-owned">0</div><div class="l">Cards owned</div></div>
      <div class="gstat"><div class="v" id="g-total">0</div><div class="l">Cards tracked</div></div>
      <div class="gstat"><div class="v" id="g-binders">0</div><div class="l">Binders</div></div>
      <div class="gstat"><div class="v" id="g-complete">0</div><div class="l">Complete</div></div>
      <div class="ring" id="g-ring"></div>
    </div>
  </header>

  <div class="sec-head">
    <h2>Choose a game</h2>
    <span class="n" id="ip-count"></span>
  </div>

  <main class="ips" id="ips"></main>
</div>

<script src="js/sync.js?v=16"></script>
<script src="data/catalog.js?v=16"></script>
<script src="data/themes.js?v=16"></script>
<script src="js/ip-home.js?v=16"></script>
</body>
</html>
